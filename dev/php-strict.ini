; A locked-down host: functions some hosts disable, and an open_basedir that leaves out
; PHP's upload temp folder (/tmp, set as upload_tmp_dir, so PHP writes there but scripts cannot read it). On PHP 8 a disabled function is undefined: calling it is fatal.
disable_functions = set_time_limit,flock,disk_free_space,opcache_reset
open_basedir = /var/www/html
upload_tmp_dir = /tmp
